name: iOS tests

on:
  pull_request:
  schedule:
    - cron: '0 17 * * *' # 01:00 Asia/Shanghai
  workflow_dispatch:
    inputs:
      suite:
        description: Test suite
        type: choice
        options: [pr, nightly]
        default: pr

permissions:
  contents: read

jobs:
  test:
    name: iOS simulator tests
    runs-on: macos-15
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      TEST_OUTPUT_DIR: ${{ runner.temp }}/staryigo-tests
      TEST_SUITE: ${{ (github.event_name == 'schedule' && 'nightly') || inputs.suite || 'pr' }}
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: ./scripts/test-ios.sh "$TEST_SUITE"
      - name: Save test results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iOS-${{ env.TEST_SUITE }}-${{ github.run_attempt }}
          path: |
            ${{ env.TEST_OUTPUT_DIR }}/*.xcresult
            ${{ env.TEST_OUTPUT_DIR }}/*.log
